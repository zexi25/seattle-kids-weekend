# .github/workflows/update_events.yml
name: Update Weekend Events

on:
  schedule:
    # 每周四 UTC 18:00（西雅图时间周四上午 10:00-11:00）自动执行
    - cron: '0 18 * * 4'
  workflow_dispatch: # 支持在 GitHub 控制台手动点击触发

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 "urllib3<2.0"

      - name: Run Crawler Pipeline
        run: |
          python3 scripts/crawler/sync_all.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git status --porcelain public/data/events.geojson | grep -q 'events.geojson'; then
            echo "检测到数据更新，正在提交并推送..."
            git add public/data/events.geojson
            git commit -m "chore(data): auto sync weekend events $(date +'%Y-%m-%d')"
            git push
          else
            echo "数据无变动，跳过提交。"
          fi
